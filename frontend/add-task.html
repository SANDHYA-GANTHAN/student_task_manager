<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Task | Student Tasks</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✓
            </div>

            <div class="logo-text">
                TaskFlow
            </div>

        </div>


        <div class="nav-label">
            Workspace
        </div>


        <nav class="nav">

            <a href="index.html">

                <span class="nav-icon">⌂</span>

                <span>Dashboard</span>

            </a>


            <a href="tasks.html">

                <span class="nav-icon">☷</span>

                <span>My Tasks</span>

            </a>


            <a
                href="add-task.html"
                class="active"
            >

                <span class="nav-icon">＋</span>

                <span>Add Task</span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="profile">

                <div class="avatar">
                    S
                </div>

                <div>

                    <div class="profile-name">
                        Student
                    </div>

                    <div class="profile-role">
                        Task Manager
                    </div>

                </div>

            </div>

        </div>

    </aside>


    <main class="main">

        <div class="page">


            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        Create a Task
                    </h1>

                    <p class="page-subtitle">
                        Add something you want to accomplish.
                    </p>

                </div>

            </div>


            <div class="card form-card">

                <form id="taskForm">


                    <div class="form-group">

                        <label class="form-label">
                            Task title
                        </label>

                        <input
                            class="form-input"
                            id="title"
                            type="text"
                            placeholder="e.g. Complete DBMS assignment"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-textarea"
                            id="description"
                            placeholder="Add some details about this task..."
                        ></textarea>

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                class="form-select"
                                id="priority"
                            >

                                <option value="Low">
                                    Low
                                </option>

                                <option
                                    value="Medium"
                                    selected
                                >
                                    Medium
                                </option>

                                <option value="High">
                                    High
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Due date
                            </label>

                            <input
                                class="form-input"
                                id="due_date"
                                type="date"
                            >

                        </div>


                    </div>


                    <div class="form-actions">

                        <a
                            href="tasks.html"
                            class="secondary-btn"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="primary-btn"
                        >
                            Create Task
                        </button>

                    </div>


                </form>

            </div>


        </div>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="add-task.js"></script>

</body>

</html>
