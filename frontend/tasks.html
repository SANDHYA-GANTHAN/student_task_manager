<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Tasks | Student Tasks</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✓
            </div>

            <div class="logo-text">
                TaskFlow
            </div>

        </div>


        <div class="nav-label">
            Workspace
        </div>


        <nav class="nav">

            <a href="index.html">

                <span class="nav-icon">⌂</span>

                <span>Dashboard</span>

            </a>


            <a
                href="tasks.html"
                class="active"
            >

                <span class="nav-icon">☷</span>

                <span>My Tasks</span>

            </a>


            <a href="add-task.html">

                <span class="nav-icon">＋</span>

                <span>Add Task</span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <div class="profile">

                <div class="avatar">
                    S
                </div>

                <div>

                    <div class="profile-name">
                        Student
                    </div>

                    <div class="profile-role">
                        Task Manager
                    </div>

                </div>

            </div>

        </div>

    </aside>


    <main class="main">

        <div class="page">


            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        My Tasks
                    </h1>

                    <p class="page-subtitle">
                        Everything you need to get done.
                    </p>

                </div>


                <a
                    href="add-task.html"
                    class="primary-btn"
                >
                    ＋ Add Task
                </a>

            </div>


            <div class="toolbar">

                <div class="search">

                    <span class="search-icon">
                        ⌕
                    </span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks..."
                    >

                </div>


                <select
                    class="filter"
                    id="statusFilter"
                >

                    <option value="all">
                        All tasks
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                </select>


                <select
                    class="filter"
                    id="priorityFilter"
                >

                    <option value="all">
                        All priorities
                    </option>

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>


            <div class="card">

                <div
                    class="task-list"
                    id="taskList"
                ></div>

            </div>


        </div>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="tasks.js"></script>

</body>

</html>
